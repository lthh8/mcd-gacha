<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门图鉴 · 全息闪卡 Demo（D 方案 · 零积分）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 22%,#2c3a5e,#0f1320 72%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;color:#eae4d6}
  .cap{font-size:13px;color:#9fb2dd;margin-bottom:16px;letter-spacing:1px}
  .cap b{color:#ffd27a}
  .scene{perspective:1100px;width:360px;height:480px}
  .card{position:relative;width:360px;height:480px;border-radius:18px;overflow:hidden;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .12s ease-out;transform-style:preserve-3d;
    box-shadow:0 26px 54px rgba(0,0,0,.65),0 0 0 2px rgba(255,215,120,.30)}
  .card svg{display:block;width:100%;height:100%}
  /* 镭射：只走外圈（中心遮罩保护图案区），宝可梦式"插画哑光、边框闪" */
  .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.30;
    background:repeating-linear-gradient(115deg,
      rgba(255,0,200,.95) 0 5%, rgba(255,120,0,.95) 5% 10%,
      rgba(255,235,0,.95) 10% 15%, rgba(0,255,130,.95) 15% 20%,
      rgba(0,200,255,.95) 20% 25%, rgba(160,0,255,.95) 25% 30%, transparent 30% 46%);
    background-size:230% 230%;filter:blur(2px);animation:holoFlow 5s linear infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 54%,transparent 40%,#000 85%);
            mask-image:radial-gradient(circle at 50% 54%,transparent 40%,#000 85%)}
  @keyframes holoFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .sweep{position:absolute;top:-25%;left:-45%;width:34%;height:150%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(14deg);mix-blend-mode:screen;filter:blur(5px);
    animation:sweep 3.2s ease-in-out infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 54%,transparent 42%,#000 88%);
            mask-image:radial-gradient(circle at 50% 54%,transparent 42%,#000 88%)}
  @keyframes sweep{0%{left:-40%}60%{left:112%}100%{left:112%}}
  .glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.40;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.55),rgba(255,255,255,0) 52%)}
  .spark{position:absolute;pointer-events:none;mix-blend-mode:screen;border-radius:50%;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);
    animation:tw 1.8s ease-in-out infinite}
  .spark.a{top:15%;left:11%;width:9px;height:9px}
  .spark.b{top:71%;left:85%;width:12px;height:12px;animation-delay:.6s}
  .spark.c{top:44%;left:5%;width:7px;height:7px;animation-delay:1.1s}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
  .hint{margin-top:18px;font-size:12px;color:#8b93b5}
  /* SSR 稀有度徽章：金黄渐变（冷底更跳），右上角 */
  .rarity{position:absolute;top:14px;right:14px;z-index:6;font-size:11px;font-weight:800;
    padding:3px 9px;border-radius:7px;color:#fff;text-shadow:0 1px 2px rgba(90,50,0,.55);
    background:linear-gradient(135deg,#ffe27a,#ffb300 55%,#ff8f00);box-shadow:0 2px 10px rgba(255,170,0,.65)}
</style>
</head>
<body>
  <div class="cap">麦门图鉴 · <b>D 方案：纯 HTML/CSS 全息闪卡（零积分 · 不生图）</b> — 冷调放射星空背景 · 镭射只走外圈 · 图案区恒清晰</div>

  <div class="scene" id="scene">
    <div class="card">
      <span class="rarity">SSR</span>

      <svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 冷调夜空底：中央亮、四周暗，突出中间图案 -->
          <radialGradient id="sky" cx="50%" cy="52%" r="75%">
            <stop offset="0" stop-color="#3d5183"/><stop offset=".45" stop-color="#26325a"/>
            <stop offset=".78" stop-color="#1a2342"/><stop offset="1" stop-color="#10162c"/>
          </radialGradient>
          <radialGradient id="ctrGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#cfe8ff" stop-opacity=".22"/>
            <stop offset=".55" stop-color="#9fc8ff" stop-opacity=".10"/>
            <stop offset="1" stop-color="#9fc8ff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="vig" cx="50%" cy="52%" r="72%">
            <stop offset="0" stop-color="#080d1a" stop-opacity="0"/>
            <stop offset=".62" stop-color="#080d1a" stop-opacity="0"/>
            <stop offset="1" stop-color="#080d1a" stop-opacity=".62"/>
          </radialGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="5"/></filter>
          <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="d"/>
            <feDisplacementMap in="SourceGraphic" in2="d" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
          <clipPath id="glass"><path d="M152,286 L156,396 Q180,404 204,396 L208,286 Z"/></clipPath>
          <path id="ray" d="M180,285 L175,-280 L185,-280 Z" fill="#e8f1ff"/>
        </defs>

        <!-- 1 夜空底 -->
        <rect width="360" height="480" fill="url(#sky)"/>
        <!-- 2 放射光束（宝可梦式 sunburst） -->
        <g opacity=".05">
          <use href="#ray"/><use href="#ray" transform="rotate(22.5 180 285)"/>
          <use href="#ray" transform="rotate(45 180 285)"/><use href="#ray" transform="rotate(67.5 180 285)"/>
          <use href="#ray" transform="rotate(90 180 285)"/><use href="#ray" transform="rotate(112.5 180 285)"/>
          <use href="#ray" transform="rotate(135 180 285)"/><use href="#ray" transform="rotate(157.5 180 285)"/>
          <use href="#ray" transform="rotate(180 180 285)"/><use href="#ray" transform="rotate(202.5 180 285)"/>
          <use href="#ray" transform="rotate(225 180 285)"/><use href="#ray" transform="rotate(247.5 180 285)"/>
          <use href="#ray" transform="rotate(270 180 285)"/><use href="#ray" transform="rotate(292.5 180 285)"/>
          <use href="#ray" transform="rotate(315 180 285)"/><use href="#ray" transform="rotate(337.5 180 285)"/>
        </g>
        <!-- 3 星点宇宙纹（Cosmos Holo） -->
        <g fill="#ffffff">
          <circle cx="38" cy="70" r="1.6" opacity=".8"/><circle cx="72" cy="44" r="1.1" opacity=".5"/>
          <circle cx="110" cy="96" r="1.4" opacity=".65"/><circle cx="300" cy="58" r="1.7" opacity=".85"/>
          <circle cx="324" cy="98" r="1.2" opacity=".55"/><circle cx="284" cy="126" r="1.5" opacity=".7"/>
          <circle cx="60" cy="170" r="1.3" opacity=".6"/><circle cx="332" cy="182" r="1.6" opacity=".75"/>
          <circle cx="44" cy="240" r="1.2" opacity=".5"/><circle cx="30" cy="302" r="1.5" opacity=".65"/>
          <circle cx="318" cy="262" r="1.3" opacity=".6"/><circle cx="334" cy="332" r="1.6" opacity=".7"/>
          <circle cx="58" cy="352" r="1.2" opacity=".55"/><circle cx="86" cy="420" r="1.5" opacity=".65"/>
          <circle cx="300" cy="428" r="1.4" opacity=".7"/><circle cx="256" cy="150" r="1.1" opacity=".45"/>
          <circle cx="128" cy="132" r="1.3" opacity=".55"/><circle cx="200" cy="38" r="1.5" opacity=".7"/>
          <circle cx="170" cy="112" r="1.1" opacity=".5" fill="#cfe4ff"/><circle cx="238" cy="172" r="1.2" opacity=".5" fill="#cfe4ff"/>
          <circle cx="52" cy="120" r="1.2" opacity=".5" fill="#ffe9bd"/><circle cx="312" cy="146" r="1.1" opacity=".5" fill="#ffe9bd"/>
        </g>
        <!-- 4 中央辉光：把中间图案托亮 -->
        <circle cx="180" cy="285" r="155" fill="url(#ctrGlow)"/>
        <!-- 5 渐晕 -->
        <rect width="360" height="480" fill="url(#vig)"/>
        <!-- 6 金色双描边 -->
        <rect x="12" y="12" width="336" height="456" rx="8" fill="none" stroke="#d8b26a" stroke-width="1.8"/>
        <rect x="18" y="18" width="324" height="444" rx="5" fill="none" stroke="#e8c987" stroke-width="0.7"/>

        <!-- 水印 -->
        <text x="180" y="300" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-size="96"
              fill="#ffffff" opacity="0.05" transform="rotate(-12 180 300)">麦门</text>

        <!-- 标题 -->
        <text x="180" y="60" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-size="38"
              fill="#f6e7c3" letter-spacing="5" filter="url(#tglow)">麦旋风</text>
        <text x="180" y="82" text-anchor="middle" font-size="11.5" fill="#cbb26b" letter-spacing="6">MAI XUAN FENG</text>
        <line x1="122" y1="92" x2="238" y2="92" stroke="#b08d4a" stroke-width="0.9"/>

        <!-- 顶部彩针点缀 -->
        <g>
          <circle cx="66" cy="120" r="3" fill="#ff7043"/><circle cx="92" cy="138" r="2.4" fill="#42a5f5"/>
          <circle cx="300" cy="118" r="3" fill="#ab47bc"/><circle cx="276" cy="140" r="2.4" fill="#66bb6a"/>
          <rect x="140" y="112" width="9" height="3" rx="1.5" fill="#ffca28" transform="rotate(-18 144 113)"/>
          <rect x="206" y="116" width="9" height="3" rx="1.5" fill="#ef5350" transform="rotate(22 210 117)"/>
          <circle cx="120" cy="150" r="2" fill="#26c6da"/><circle cx="244" cy="152" r="2" fill="#ec407a"/>
        </g>

        <!-- 主体：放大 1.42 倍的彩色分层甜品杯（投影压暗托底） -->
        <ellipse cx="180" cy="400" rx="64" ry="10" fill="#070c18" opacity=".45" filter="url(#soft)"/>
        <g transform="translate(180,282) scale(1.42) translate(-180,-300)" filter="url(#wob)">
          <path d="M152,286 L156,396 Q180,404 204,396 L208,286 Z" fill="#ffffff" opacity=".3"/>
          <g clip-path="url(#glass)">
            <rect x="140" y="284" width="120" height="30" fill="#dff1fb"/>
            <rect x="140" y="314" width="120" height="20" fill="#fff3d6"/>
            <rect x="140" y="334" width="120" height="20" fill="#f7a8c6"/>
            <rect x="140" y="354" width="120" height="20" fill="#a8d98a"/>
            <rect x="140" y="374" width="120" height="30" fill="#9c6b4a"/>
          </g>
          <g stroke="#ffffff" stroke-width="1.6" fill="none" opacity=".8">
            <path d="M153,314 q9,-4 18,0 t18,0 t18,0"/>
            <path d="M153,334 q9,-4 18,0 t18,0 t18,0"/>
            <path d="M153,354 q9,-4 18,0 t18,0 t18,0"/>
            <path d="M153,374 q9,-4 18,0 t18,0 t18,0"/>
          </g>
          <ellipse cx="180" cy="286" rx="28" ry="6" fill="#ffffff" opacity=".55"/>
          <path d="M152,286 L156,396 Q180,404 204,396 L208,286" fill="none" stroke="#d7e2f2" stroke-width="2"/>
          <path d="M160,292 Q158,344 166,392" fill="none" stroke="#ffffff" stroke-width="3" opacity=".5"/>
          <ellipse cx="180" cy="280" rx="30" ry="13" fill="#fffdf6" stroke="#e6d8bb" stroke-width="1"/>
          <ellipse cx="171" cy="260" rx="26" ry="12" fill="#fffdf6" stroke="#e6d8bb" stroke-width="1"/>
          <ellipse cx="189" cy="242" rx="22" ry="10" fill="#fffdf6" stroke="#e6d8bb" stroke-width="1"/>
          <ellipse cx="178" cy="226" rx="17" ry="8"  fill="#fffdf6" stroke="#e6d8bb" stroke-width="1"/>
          <ellipse cx="187" cy="214" rx="11" ry="6"  fill="#fffdf6" stroke="#e6d8bb" stroke-width="1"/>
          <path d="M156,280 q24,-8 48,0" fill="none" stroke="#eccfa0" stroke-width="1"/>
          <path d="M150,260 q24,-8 44,0" fill="none" stroke="#eccfa0" stroke-width="1"/>
          <g>
            <circle cx="160" cy="240" r="10" fill="#ef5350"/>
            <path d="M160,230 l-8,-4 M160,230 l8,-4 M160,230 l0,-7" stroke="#43a047" stroke-width="2.4" fill="none"/>
            <circle cx="203" cy="234" r="5" fill="#4a5c9a"/><circle cx="212" cy="246" r="4" fill="#3f51b5"/>
            <rect x="150" y="252" width="8" height="2.6" rx="1.3" fill="#ff7043" transform="rotate(-20 154 253)"/>
            <rect x="196" y="258" width="8" height="2.6" rx="1.3" fill="#42a5f5" transform="rotate(25 200 259)"/>
            <rect x="172" y="266" width="8" height="2.6" rx="1.3" fill="#ffee58" transform="rotate(-8 176 267)"/>
            <rect x="205" y="200" width="7" height="42" rx="3" fill="#e9c781" transform="rotate(18 208 221)"/>
            <path d="M186,206 q14,-12 26,-2 q-12,10 -26,2 z" fill="#66bb6a"/>
          </g>
        </g>

        <!-- 左右彩色引线标注（填满侧空白） -->
        <g stroke-width="1" fill="none">
          <path d="M221,280 L246,278" stroke="#4fc3f7"/><path d="M221,352 L246,352" stroke="#ec407a"/>
          <path d="M221,412 L246,414" stroke="#a1887f"/><path d="M139,381 L116,383" stroke="#9ccc65"/>
          <path d="M139,320 L116,318" stroke="#ffca28"/>
        </g>
        <g font-size="12.5" font-family="KaiTi,STKaiti,serif" font-weight="bold"
           stroke="#0d1526" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">
          <circle cx="252" cy="278" r="3.2" fill="#29b6f6" stroke="none"/><text x="259" y="283" fill="#a5e6ff">冰沙</text>
          <circle cx="252" cy="352" r="3.2" fill="#ec407a" stroke="none"/><text x="259" y="357" fill="#ffb3d9">草莓酱</text>
          <circle cx="252" cy="414" r="3.2" fill="#c9a06b" stroke="none"/><text x="259" y="419" fill="#e8c39a">巧克力</text>
          <circle cx="108" cy="383" r="3.2" fill="#9ccc65" stroke="none"/><text x="101" y="388" text-anchor="end" fill="#c8ecab">抹茶</text>
          <circle cx="108" cy="318" r="3.2" fill="#ffca28" stroke="none"/><text x="101" y="323" text-anchor="end" fill="#ffe6ad">奶盖</text>
        </g>

        <!-- 底部两侧彩针 -->
        <g>
          <circle cx="70" cy="452" r="2.6" fill="#ff7043"/><circle cx="96" cy="440" r="2.2" fill="#42a5f5"/>
          <circle cx="290" cy="452" r="2.6" fill="#ab47bc"/><circle cx="264" cy="440" r="2.2" fill="#66bb6a"/>
        </g>

        <!-- 底部品牌印 -->
        <g transform="translate(180,452)">
          <circle r="19" fill="none" stroke="#ff6f5e" stroke-width="1.6"/>
          <circle r="15.5" fill="none" stroke="#ff6f5e" stroke-width="0.6"/>
          <rect x="-8" y="-7" width="16" height="3.6" rx="1.4" fill="#ff6f5e"/>
          <rect x="-8" y="-1.6" width="16" height="2.8" rx="1.1" fill="#ff6f5e"/>
          <rect x="-8" y="2.4" width="16" height="3.6" rx="1.4" fill="#ff6f5e"/>
          <text y="14" text-anchor="middle" font-size="8.5" fill="#ff8a76" font-family="KaiTi,serif">麦门图鉴</text>
        </g>
      </svg>
      <div class="holo"></div><div class="sweep"></div><div class="glare"></div>
      <div class="spark a"></div><div class="spark b"></div><div class="spark c"></div>
    </div>
  </div>
  <div class="hint">镭射只走外圈（中心遮罩，图案区恒清晰）· 周期白光扫过 · 星点闪烁 · 移动鼠标叠加跟随高光与 3D 倾斜</div>

<script>
  const scene=document.getElementById('scene');
  scene.addEventListener('pointermove',e=>{
    const r=scene.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
    scene.style.setProperty('--mx',(px*100).toFixed(1)+'%');
    scene.style.setProperty('--my',(py*100).toFixed(1)+'%');
    scene.style.setProperty('--ry',((px-0.5)*26).toFixed(1)+'deg');
    scene.style.setProperty('--rx',((0.5-py)*26).toFixed(1)+'deg');
  });
  scene.addEventListener('pointerleave',()=>{
    scene.style.setProperty('--rx','0deg');scene.style.setProperty('--ry','0deg');
    scene.style.setProperty('--mx','50%');scene.style.setProperty('--my','50%');
  });
</script>
</body>
</html>
