<style>

  .chip{font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
    border:1px solid rgba(216,178,106,.45);color:#d8c69a;background:rgba(216,178,106,.08);
    transition:all .15s}
  .chip:hover{border-color:#ffd27a;color:#ffd27a}

  .grid{display:grid;grid-template-columns:repeat(4,245px);gap:22px;justify-content:center}

  @media (max-width:820px){.grid{grid-template-columns:repeat(2,245px)}}
  @media (max-width:560px){.grid{grid-template-columns:repeat(1,245px)}}

  .scene{perspective:1100px;width:360px;height:480px;transform:scale(.681);transform-origin:top left}
  .card{position:relative;width:360px;height:480px;border-radius:18px;overflow:hidden;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .12s ease-out;transform-style:preserve-3d;
    box-shadow:0 22px 46px rgba(0,0,0,.6),0 0 0 2px rgba(255,215,120,.28)}
  .scene:hover .card{scale:1.025}
  .card svg{display:block;width:100%;height:100%}

  .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.30;
    background:repeating-linear-gradient(115deg,
      rgba(255,0,200,.95) 0 5%, rgba(255,120,0,.95) 5% 10%,
      rgba(255,235,0,.95) 10% 15%, rgba(0,255,130,.95) 15% 20%,
      rgba(0,200,255,.95) 20% 25%, rgba(160,0,255,.95) 25% 30%, transparent 30% 46%);
    background-size:230% 230%;filter:blur(2px);animation:holoFlow 5s linear infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 54%,transparent 40%,#000 85%);
            mask-image:radial-gradient(circle at 50% 54%,transparent 40%,#000 85%)}
  @keyframes holoFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .sweep{position:absolute;top:-25%;left:-45%;width:34%;height:150%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(14deg);mix-blend-mode:screen;filter:blur(5px);
    animation:sweep 3.2s ease-in-out infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 54%,transparent 42%,#000 88%);
            mask-image:radial-gradient(circle at 50% 54%,transparent 42%,#000 88%)}
  @keyframes sweep{0%{left:-40%}60%{left:112%}100%{left:112%}}
  .glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.40;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.55),rgba(255,255,255,0) 52%)}
  .spark{position:absolute;pointer-events:none;mix-blend-mode:screen;border-radius:50%;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);
    animation:tw 1.8s ease-in-out infinite}
  .spark.a{top:15%;left:11%;width:9px;height:9px}
  .spark.b{top:71%;left:85%;width:12px;height:12px;animation-delay:.6s}
  .spark.c{top:44%;left:5%;width:7px;height:7px;animation-delay:1.1s}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
  /* 稀有度徽章：右上角，按稀有度分色 */
  .rarity{position:absolute;top:14px;right:14px;z-index:6;font-size:11px;font-weight:800;
    padding:3px 9px;border-radius:7px;color:#fff;text-shadow:0 1px 2px rgba(60,30,0,.5)}

  .rar-r  {background:linear-gradient(135deg,#82b1ff,#2962ff);box-shadow:0 2px 10px rgba(60,120,255,.5)}
  .rar-n  {background:linear-gradient(135deg,#b0bec5,#78909c);box-shadow:0 2px 10px rgba(120,144,156,.5)}

  .lbl{font-family:KaiTi,STKaiti,serif;font-weight:bold;font-size:11.5px;
    paint-order:stroke;stroke:#0d1526;stroke-width:3.2;stroke-linejoin:round}
  .ft{margin-top:30px;text-align:center;font-size:11px;color:#767f9e}

  .lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .lb[hidden]{display:none}
  .lb-mask{position:absolute;inset:0;background:rgba(4,8,18,.85);backdrop-filter:blur(6px);animation:lbFade .18s ease}
  @keyframes lbFade{from{opacity:0}to{opacity:1}}
  .lb-box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;animation:lbPop .24s cubic-bezier(.2,.9,.3,1.15)}
  @keyframes lbPop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
  .lb-stage{perspective:1200px;line-height:0}
  .lb-card{width:min(74vw,calc(76vh*0.75));aspect-ratio:360/480;height:auto!important;
    border-radius:18px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .12s ease-out;transform-style:preserve-3d}
  .lb-close{position:absolute;top:-46px;right:-4px;width:36px;height:36px;border:none;border-radius:50%;
    background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;line-height:1;padding:0}
  .lb-close:hover{background:rgba(255,255,255,.26)}
  .lb-cap{color:#e8d9b8;font-size:14px;letter-spacing:1px;margin-top:16px;line-height:1.5;text-align:center}

  .lb-hint{color:#8b93a8;font-size:12px;margin-top:4px;letter-spacing:2px}
  @media (max-width:560px){.lb-card{width:min(88vw,calc(66vh*0.75))}}

/* 3D 倾斜 */
document.querySelectorAll('.scene').forEach(sc=>{
  sc.addEventListener('pointermove',e=>{
    const r=sc.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
    sc.style.setProperty('--mx',(px*100).toFixed(1)+'%');
    sc.style.setProperty('--my',(py*100).toFixed(1)+'%');
    sc.style.setProperty('--ry',((px-0.5)*26).toFixed(1)+'deg');
    sc.style.setProperty('--rx',((0.5-py)*26).toFixed(1)+'deg');
  });
  sc.addEventListener('pointerleave',()=>{
    sc.style.setProperty('--rx','0deg');sc.style.setProperty('--ry','0deg');
    sc.style.setProperty('--mx','50%');sc.style.setProperty('--my','50%');
  });
});

/* 稀有度筛选 */
const chips=document.getElementById('chips');
chips.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');
  const r=c.dataset.r;
  document.querySelectorAll('.cell').forEach(cell=>{
    cell.style.display=(r==='ALL'||cell.dataset.r===r)?'':'none';
  });
});

(function(){

    stage.innerHTML='';

    const c=card.cloneNode(true);c.classList.add('lb-card');
    scene.appendChild(c);stage.appendChild(scene);
    const f=FOODS.find(x=>x.key===key);
    const r=(c.querySelector('.rarity')||{}).textContent||'';
    cap.innerHTML=f?`<b>${f.name}</b> <span style="opacity:.72">· ${f.pinyin} · ${r}</span>`:'';
    lb.hidden=false;document.body.style.overflow='hidden';
  }
  function close(){lb.hidden=true;stage.innerHTML='';document.body.style.overflow=''}
  document.addEventListener('click',e=>{
    if(!lb.hidden){ if(e.target.closest('.lb-close')||e.target.classList.contains('lb-mask')||e.target.closest('.lb-cap'))close(); return; }
    const card=e.target.closest('.cell .card'); if(!card)return;
    const cell=card.closest('.cell'); if(!cell)return;
    open(card,cell.dataset.key);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.hidden)close()});
  stage.addEventListener('pointermove',e=>{
    const c=stage.querySelector('.lb-card');if(!c)return;
    const r=c.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    c.style.setProperty('--mx',(px*100).toFixed(1)+'%');c.style.setProperty('--my',(py*100).toFixed(1)+'%');
    c.style.setProperty('--ry',((px-0.5)*16).toFixed(1)+'deg');c.style.setProperty('--rx',((0.5-py)*16).toFixed(1)+'deg');
  });
  stage.addEventListener('pointerleave',()=>{
    const c=stage.querySelector('.lb-card');
    if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%')}
  });
})();
</script>
<div class="lb" id="lb" hidden>
  <div class="lb-mask"></div>
  <div class="lb-box">
    <button class="lb-close" type="button" title="关闭（Esc）">&times;</button>
    <div class="lb-stage" id="lbStage"></div>
    <div class="lb-cap" id="lbCap"></div>
    <div class="lb-hint">点击任意处或按 Esc 关闭</div>
  </div>
</div>
</body>
</html>
